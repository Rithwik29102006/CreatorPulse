<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CreatorPulse AI</title>
    <style>
        :root {
            --bg: #f8f9fa;
            --surface: #ffffff;
            --surface-muted: #f1f3f4;
            --border: #dadce0;
            --border-subtle: #e8eaed;
            --text: #202124;
            --text-secondary: #5f6368;
            --blue: #1a73e8;
            --blue-hover: #1557b0;
            --blue-soft: #e8f0fe;
            --blue-ink: #174ea6;
            --green: #1e8e3e;
            --green-soft: #e6f4ea;
            --amber: #e37400;
            --amber-soft: #fef7e0;
            --red: #d93025;
            --red-soft: #fce8e6;
            --shadow-sm: 0 1px 2px rgba(60, 64, 67, 0.08), 0 1px 3px rgba(60, 64, 67, 0.06);
            --shadow-md: 0 2px 6px rgba(60, 64, 67, 0.12), 0 1px 2px rgba(60, 64, 67, 0.08);
            --radius: 12px;
            --radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .app-header {
            position: sticky;
            top: 0;
            z-index: 20;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .header-inner {
            max-width: 1040px;
            margin: 0 auto;
            padding: 12px 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .brand-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: var(--blue);
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 1px 3px rgba(26, 115, 232, 0.35);
        }

        .brand-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
            margin: 0;
            letter-spacing: -0.01em;
            overflow-wrap: anywhere;
        }

        .brand-sub {
            font-size: 12px;
            color: var(--text-secondary);
            margin: 0;
        }

        .header-controls {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .toggle-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
            cursor: pointer;
            user-select: none;
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--surface);
            transition: background 0.15s;
        }

        .toggle-label:hover {
            background: var(--bg);
        }

        .toggle-input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-track {
            width: 34px;
            height: 20px;
            border-radius: 999px;
            background: #bdc1c6;
            position: relative;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .toggle-track::after {
            content: "";
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
            transition: transform 0.2s;
        }

        .toggle-input:checked+.toggle-track {
            background: var(--blue);
        }

        .toggle-input:checked+.toggle-track::after {
            transform: translateX(14px);
        }

        .key-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            transition: background 0.15s;
        }

        .key-btn:hover {
            background: var(--bg);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--amber);
        }

        .status-dot.ready {
            background: var(--green);
        }

        .api-drawer {
            background: var(--blue-soft);
            border-bottom: 1px solid #d2e3fc;
            display: none;
        }

        .api-drawer.open {
            display: block;
        }

        .api-drawer-inner {
            max-width: 1040px;
            margin: 0 auto;
            padding: 12px 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        .api-drawer label {
            font-size: 13px;
            font-weight: 600;
            color: var(--blue-ink);
        }

        .api-input {
            flex: 1 1 240px;
            min-width: 180px;
            padding: 8px 12px;
            border: 1px solid #aecbfa;
            border-radius: var(--radius-sm);
            font-size: 13px;
            background: #fff;
            color: var(--text);
        }

        .model-select {
            padding: 8px 10px;
            border: 1px solid #aecbfa;
            border-radius: var(--radius-sm);
            font-size: 13px;
            background: #fff;
            color: var(--text);
        }

        .api-hint {
            width: 100%;
            font-size: 12px;
            color: var(--blue-ink);
            margin: 0;
        }

        .api-hint a {
            color: var(--blue);
            font-weight: 600;
        }

        .tabs-bar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .tabs-inner {
            max-width: 1040px;
            margin: 0 auto;
            padding: 0 16px;
            display: flex;
            gap: 4px;
        }

        .tab-btn {
            appearance: none;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: color 0.15s, border-color 0.15s, background 0.15s;
        }

        .tab-btn:hover {
            color: var(--text);
            background: var(--bg);
        }

        .tab-btn.active {
            color: var(--blue);
            border-bottom-color: var(--blue);
        }

        .tab-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 7px;
            border-radius: 999px;
            background: var(--surface-muted);
            color: var(--text-secondary);
        }

        .tab-btn.active .tab-badge {
            background: var(--blue-soft);
            color: var(--blue-ink);
        }
